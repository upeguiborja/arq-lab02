# Workflow name
name: "CI/CD Pipeline"
on:
  # Manually trigger workflow runs
  workflow_dispatch:

  # Trigger the workflow on push from the main branch
  push:
    branches:
      - "main"
jobs:
  # Test job
  tests:
    name: "Unit tests"

    # Run on Ubuntu using the latest version
    runs-on: "ubuntu-latest"

    # Job's steps
    steps:
      # Check-out your repository under $GITHUB_WORKSPACE, so your workflow can access it
      - uses: "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5"
        with:
          fetch-depth: 0

      # Set up JDK 17
      - name: "Set up JDK"
        uses: "actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78"
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # Run tests
      - name: "Run Tests"
        run: "mvn -B test"

  # Sonar job
  sonar:
    name: "SonarCloud analysis"

    # Depends on the test job
    needs: "tests"

    # Run on Ubuntu using the latest version
    runs-on: "ubuntu-latest"

    # Job's steps
    permissions:
      contents: "read"

    steps:
      # Check-out your repository under $GITHUB_WORKSPACE, so your workflow can access it
      - uses: "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5"
        with:
          fetch-depth: 0

      - name: "Set up JDK"
        uses: "actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78"
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: "Java version"
        run: "java -version"

      - name: "Maven version"
        run: "mvn -version"

      - name: "Build project"
        run: "mvn -B clean verify"

      - name: "SonarCloud analysis"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: "mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=arq-lab02"

  publish:
    name: Build and publish container image
    needs: sonar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    name: Trigger Render deployment
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Deploy published image
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          : "${RENDER_DEPLOY_HOOK_URL:?Set the Render deploy hook in repository secrets}"
          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA" \
            "$RENDER_DEPLOY_HOOK_URL"
