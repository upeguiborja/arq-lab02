# Workflow name
name: "CI/CD Pipeline"
on:
  # Manually trigger workflow runs
  workflow_dispatch:

  # Trigger the workflow on push from the main branch
  push:
    branches:
      - "main"
jobs:
  # Test job
  tests:
    name: "Unit tests"

    # Run on Ubuntu using the latest version
    runs-on: "ubuntu-latest"

    # Job's steps
    steps:
      # Check-out your repository under $GITHUB_WORKSPACE, so your workflow can access it
      - uses: "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5"
        with:
          fetch-depth: 0

      # Set up JDK 17
      - name: "Set up JDK"
        uses: "actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78"
        with:
          java-version: "17"
          cache: "maven"

      # Run tests
      - name: "Run Tests"
        run: "mvn -B test"

  # Sonar job
  sonar:
    name: "SonarCloud analysis"

    # Depends on the test job
    needs: "tests"

    # Run on Ubuntu using the latest version
    runs-on: "ubuntu-latest"

    # Job's steps
    permissions:
      contents: "read"

    steps:
      # Check-out your repository under $GITHUB_WORKSPACE, so your workflow can access it
      - uses: "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5"
        with:
          fetch-depth: 0

      # Set up JDK 17
      - name: "Set up JDK"
        uses: "actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78"
        with:
          java-version: "17"
          cache: "maven"

      - name: "Java version"
        run: "java -version"

      - name: "Maven version"
        run: "mvn -version"

      - name: "Build project"
        run: "mvn -B clean verify"

      - name: "SonarCloud analysis"
        run: "mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar"