# Workflow name
name: "CI/CD Pipeline"
on:
  # Manually trigger workflow runs
  workflow_dispatch:

  # Trigger the workflow on push from the main branch
  push:
    branches:
      - "main"
jobs:
  # Test job
  tests:
    name: "Unit tests"

    # Run on Ubuntu using the latest version
    runs-on: "ubuntu-latest"

    # Job's steps
    steps:
      # Check-oyt your repository under $GITHUB_WORKSPACE, so your workflow can access it
      - uses: "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5"
        with:
          fetch-depth: 0

      # Set up JDK 17
      - name: "Set up JDK"
        uses: "actions/setup-java@v1"
        with:
          java-version: "17"

      # Set up maven cache
      - name: "Cache Maven packages"
        uses: "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830"
        with:
          path: "~/.m2"
          key: "${{ runner.os }}-m2-${{ hashFiles('**/pom.xml')}}"
          restore-keys: "${{ runner.os }}-m2"

      # Set up SonarQube cache
      - name: "Cache SonarQube packages"
        uses: "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830"
        with:
          path: "~/.m2"
          key: "${{ runner.os }}-sonar"
          restore-keys:  "${{ runner.os }}-sonar"

      # Run tests
      - name: "Run Tests"
        run: "mvn -B test"

      # SonarQube Build and Analyze
      - name: "Build and analyze"
        env:
          SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}"
        run: "mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=0x4d_lab02"